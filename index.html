<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Clickinet | מסך קהל</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; transition: all 0.5s; position: relative;}
        
        #topNav { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; gap: 10px; }
        .nav-btn { background: rgba(30, 41, 59, 0.8); border: 1px solid #38bdf8; color: #38bdf8; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 1rem; backdrop-filter: blur(5px); }
        .nav-btn:hover { background: #38bdf8; color: #000; transform: scale(1.05); }
        .btn-disconnect { border-color: #ef4444; color: #ef4444; display: none; }
        .btn-disconnect:hover { background: #ef4444; color: #fff; }

        #sponsorLogo { position: absolute; top: 20px; left: 20px; max-height: 80px; display: none; border-radius: 8px; box-shadow: 0 0 15px rgba(255,255,255,0.2); z-index: 100;}
        
        #joinBox { background: #1e293b; padding: 40px; border-radius: 20px; text-align: center; border: 2px solid #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); z-index: 10;}
        input { padding: 15px; font-size: 1.5rem; text-align: center; border-radius: 10px; border: none; margin-bottom: 20px; width: 80%; background: #0b0f19; color: white; }
        button.main-btn { background: #38bdf8; color: black; border: none; padding: 15px 40px; font-size: 1.5rem; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        #mainContainer { display: none; width: 95%; height: 90vh; text-align: center; position: relative; z-index: 10;}
        .header { margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        
        .phone-display { background: #ef4444; color: white; padding: 8px 25px; border-radius: 50px; font-weight: bold; font-size: 1.6rem; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .room-pin-display { background: #38bdf8; color: #000; padding: 8px 25px; border-radius: 50px; font-weight: bold; font-size: 1.6rem; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }

        #lobbyView { display: flex; flex-direction: column; align-items: center; height: 100%; margin-top: 20px; }
        .lobby-title { font-size: 3rem; color: #38bdf8; margin-bottom: 30px; text-shadow: 0 0 15px rgba(56,189,248,0.5); }
        #playersGrid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 100%; overflow-y: auto; }
        .player-tag { background: #1e293b; border: 2px solid #334155; padding: 15px 25px; border-radius: 15px; font-size: 1.8rem; font-weight: bold; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        #gameView { display: none; margin-top: 20px; }
        h1#questionText { font-size: 3.5rem; text-shadow: 0 0 20px rgba(56,189,248,0.8); margin-bottom: 20px; color: #fff; line-height: 1.2; transition: all 0.3s;}
        
        .double-points-active #questionText { color: #eab308; text-shadow: 0 0 30px rgba(234,179,8,0.9); transform: scale(1.05); }
        .double-label { display: none; color: #eab308; font-size: 1.5rem; font-weight: bold; background: #000; padding: 5px 15px; border-radius: 20px; border: 2px dashed #eab308; margin-bottom: 10px; animation: pulse 1s infinite; }
        .double-points-active .double-label { display: inline-block; }

        #qImg { max-height: 300px; max-width: 100%; border-radius: 15px; display: none; margin: 0 auto 20px auto; border: 3px solid #38bdf8; box-shadow: 0 0 20px rgba(56,189,248,0.5); }
        
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .answer-box { background: rgba(30,41,59,0.9); padding: 25px; border-radius: 15px; font-size: 2.2rem; font-weight: bold; border: 3px solid #334155; transition: all 0.3s; display: flex; align-items: center; text-align: right; position: relative; overflow: hidden;}
        .answer-box span.num { display: inline-block; background: #38bdf8; color: #000; width: 50px; height: 50px; line-height: 50px; border-radius: 50%; font-size: 1.8rem; margin-left: 20px; flex-shrink: 0; text-align: center; z-index: 2;}
        .answer-text { z-index: 2; }
        
        .bar-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: rgba(56, 189, 248, 0.3); z-index: 1; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .bar-count { position: absolute; left: 20px; font-size: 2rem; color: #fff; z-index: 2; opacity: 0; transition: opacity 0.5s; }

        #timerDisplay { position: absolute; top: -10px; right: 20px; font-size: 4rem; color: #f97316; font-weight: bold; text-shadow: 0 0 10px rgba(249,115,22,0.5); }
        .correct-answer { background: #10b981 !important; border-color: #fff !important; transform: scale(1.05); box-shadow: 0 0 40px rgba(16, 185, 129, 0.8); z-index: 5;}

        /* 🎛️ פס השליטה החדש בתחתית (למסך בודד) */
        #miniAdminControls { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.95); padding: 15px 0; border-top: 2px solid #38bdf8; justify-content: center; gap: 15px; z-index: 1000; backdrop-filter: blur(5px); }
        .mini-btn { background: #1e293b; color: white; border: 1px solid #475569; padding: 10px 20px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; transition: 0.2s; font-weight: bold; }
        .mini-btn:hover { background: #334155; transform: translateY(-2px); }

        @keyframes popIn { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translate(0,0); } 10%, 30%, 50%, 70%, 90% { transform: translate(-5px,0); } 20%, 40%, 60%, 80% { transform: translate(5px,0); } }
    </style>
</head>
<body onclick="enableAudio()">

    <div id="topNav">
        <button class="nav-btn" onclick="window.location.href='/'">🌐 לפורטל הראשי</button>
        <button class="nav-btn" onclick="window.open('/admin', '_blank')">⚙️ ניהול משחק</button>
        <button class="nav-btn btn-disconnect" id="disconnectBtn" onclick="disconnectRoom()">🚪 התנתק מחדר</button>
    </div>

    <img id="sponsorLogo" src="" alt="Sponsor">
    <audio id="bgMusic" loop src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <div id="joinBox">
        <h1 style="font-size: 3.5rem; margin: 0; color: #38bdf8;">קליקינט 🎮</h1>
        <p style="color: #94a3b8; font-size: 1.3rem; margin-bottom: 30px;">הקש קוד מפיק להצגת המסך הראשי</p>
        <input type="text" id="roomIdInput" placeholder="קוד משחק...">
        <br>
        <button class="main-btn" onclick="joinRoom()">התחבר למסך</button>
    </div>

    <div id="mainContainer">
        <div class="header">
            <div class="phone-display">📞 חייגו: 077-2296674</div>
            <div class="room-pin-display">🎮 קוד משחק: <span id="pinText">---</span></div>
        </div>

        <div id="lobbyView">
            <h2 class="lobby-title" id="lobbyStatus">ממתינים לשחקנים...</h2>
            <div id="playersGrid"></div>
        </div>

        <div id="gameView">
            <div id="timerDisplay" style="display: none;">⏳ <span id="timeVal">15</span></div>
            <div class="double-label">✨ שאלת דאבל - ניקוד כפול! ✨</div>
            <h1 id="questionText">ממתין לשאלה...</h1>
            <img id="qImg" src="">

            <div class="answers-grid">
                <div class="answer-box" id="ans-1"><div class="bar-fill" id="bar-1"></div><span class="num">1</span> <span class="answer-text" id="text-1"></span> <span class="bar-count" id="count-1">0</span></div>
                <div class="answer-box" id="ans-2"><div class="bar-fill" id="bar-2"></div><span class="num">2</span> <span class="answer-text" id="text-2"></span> <span class="bar-count" id="count-2">0</span></div>
                <div class="answer-box" id="ans-3"><div class="bar-fill" id="bar-3"></div><span class="num">3</span> <span class="answer-text" id="text-3"></span> <span class="bar-count" id="count-3">0</span></div>
                <div class="answer-box" id="ans-4"><div class="bar-fill" id="bar-4"></div><span class="num">4</span> <span class="answer-text" id="text-4"></span> <span class="bar-count" id="count-4">0</span></div>
            </div>
        </div>
    </div>

    <div id="miniAdminControls">
        <button class="mini-btn" style="border-color:#10b981; color:#10b981;" onclick="socket.emit('startGame')">▶️ התחל</button>
        <button class="mini-btn" onclick="socket.emit('prevQuestion')">⏮️ הקודמת</button>
        <button class="mini-btn" onclick="socket.emit('nextQuestion')">⏭️ הבאה</button>
        <button class="mini-btn" style="border-color:#f97316; color:#f97316;" onclick="socket.emit('startTimer', 15)">⏱️ שעון</button>
        <button class="mini-btn" style="border-color:#3b82f6; color:#3b82f6;" onclick="socket.emit('showChart')">📊 גרף</button>
        <button class="mini-btn" style="border-color:#8b5cf6; color:#8b5cf6;" onclick="socket.emit('revealAnswer')">👁️ תשובה</button>
    </div>

    <div id="sysAlertModal" style="display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); background:#ef4444; color:white; padding:20px; border-radius:15px; z-index:10000; box-shadow:0 10px 30px rgba(0,0,0,0.5); text-align:center; min-width:300px; border: 2px solid #fff;">
        <h3 style="margin-top:0; text-shadow: 0 2px 4px rgba(0,0,0,0.3);">🚨 הודעה מהנהלת האתר</h3>
        <p id="sysAlertText" style="font-size:1.3rem; font-weight:bold; margin-bottom: 20px;"></p>
        <input type="text" id="sysAlertReply" placeholder="הקלד תגובה למנהל..." style="display:none; width:90%; padding:12px; margin-top:10px; border-radius:8px; border:none; color:black; font-size:1rem; box-sizing: border-box;">
        <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
            <button style="background:#334155; padding:10px 20px; border-radius:8px; color:#fff; border:none; cursor:pointer;" onclick="document.getElementById('sysAlertModal').style.display='none'">הבנתי, תודה</button>
            <button id="sysAlertSendBtn" style="display:none; background:#10b981; padding:10px 20px; border-radius:8px; color:#fff; border:none; font-weight:bold; cursor:pointer;" onclick="sendSysReply()">שלח תגובה למנהל</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let audioEnabled = false;
        let isGameRunning = false;
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.3;

        const sounds = {
            tada: new Audio('https://actions.google.com/sounds/v1/cartoon/pop.ogg'),
            clock: new Audio('https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg'),
            shake: new Audio('https://actions.google.com/sounds/v1/alarms/bugle_tune.ogg')
        };

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const autoPin = urlParams.get('pin');
            const savedRoom = sessionStorage.getItem('clickinetPlayerRoom');
            
            if(autoPin) { document.getElementById('roomIdInput').value = autoPin; setTimeout(joinRoom, 500); }
            else if (savedRoom) { document.getElementById('roomIdInput').value = savedRoom; joinRoom(); }
        };

        function enableAudio() { audioEnabled = true; }

        function joinRoom() {
            const roomId = document.getElementById('roomIdInput').value.trim();
            if(roomId) { document.getElementById('pinText').innerText = roomId; socket.emit('joinRoom', roomId); }
        }

        function disconnectRoom() {
            if(confirm('האם אתה בטוח שברצונך להתנתק מהחדר הנוכחי?')) {
                sessionStorage.removeItem('clickinetPlayerRoom');
                window.location.href = '/'; 
            }
        }

        socket.on('loginResponse', res => {
            if(res.success) {
                sessionStorage.setItem('clickinetPlayerRoom', document.getElementById('roomIdInput').value);
                document.getElementById('joinBox').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                document.getElementById('disconnectBtn').style.display = 'block';
                // חשיפת פס השליטה המינימלי למטה
                document.getElementById('miniAdminControls').style.display = 'flex';
            } else { alert(res.error); sessionStorage.removeItem('clickinetPlayerRoom'); }
        });

        socket.on('updateSettings', s => {
            const sponsorEl = document.getElementById('sponsorLogo');
            if(s.isGold && s.sponsorUrl) { sponsorEl.src = s.sponsorUrl; sponsorEl.style.display = 'block'; } 
            else { sponsorEl.style.display = 'none'; }
        });

        socket.on('updateLeaderboard', players => {
            const grid = document.getElementById('playersGrid');
            const status = document.getElementById('lobbyStatus');
            const playerCount = Object.keys(players).length;
            if (!isGameRunning) {
                grid.innerHTML = '';
                for (let phone in players) { grid.innerHTML += `<div class="player-tag">${players[phone].name}</div>`; }
                status.innerText = playerCount > 0 ? `מחוברים ${playerCount} שחקנים` : "ממתינים לשחקנים...";
            }
        });

        socket.on('doublePointsState', isDouble => {
            if(isDouble) document.body.classList.add('double-points-active');
            else document.body.classList.remove('double-points-active');
        });

        socket.on('newQuestion', q => {
            isGameRunning = true;
            document.getElementById('lobbyView').style.display = 'none'; document.getElementById('gameView').style.display = 'block';
            document.getElementById('questionText').innerText = q.q;
            document.getElementById('text-1').innerText = q.a1; document.getElementById('text-2').innerText = q.a2;
            document.getElementById('text-3').innerText = q.a3; document.getElementById('text-4').innerText = q.a4;
            
            const imgEl = document.getElementById('qImg');
            if(q.image) { imgEl.src = q.image; imgEl.style.display = 'block'; } else { imgEl.style.display = 'none'; }
            
            for(let i=1; i<=4; i++) {
                document.getElementById('ans-'+i).classList.remove('correct-answer');
                document.getElementById('bar-'+i).style.width = '0%';
                document.getElementById('count-'+i).style.opacity = '0';
            }
        });

        socket.on('displayChart', counts => {
            let maxVotes = 0;
            for(let i=1; i<=4; i++) { if(counts[i] > maxVotes) maxVotes = counts[i]; }
            if(maxVotes === 0) maxVotes = 1; 
            
            for(let i=1; i<=4; i++) {
                let p = (counts[i] || 0) / maxVotes * 100;
                document.getElementById('bar-'+i).style.width = p + '%';
                let c = document.getElementById('count-'+i);
                c.innerText = (counts[i] || 0) + ' קולות';
                c.style.opacity = '1';
            }
        });

        socket.on('showCorrectAnswer', ansNumber => {
            const correctDiv = document.getElementById('ans-' + ansNumber);
            if(correctDiv) { correctDiv.classList.add('correct-answer'); if(audioEnabled) sounds.tada.play().catch(e=>{}); }
        });

        socket.on('musicState', play => {
            if(!audioEnabled) return;
            if(play) bgMusic.play().catch(e=>{}); else bgMusic.pause();
        });

        socket.on('startCountdown', sec => {
            let t = sec; const tDiv = document.getElementById('timerDisplay'); const tVal = document.getElementById('timeVal');
            tDiv.style.display = 'block'; tVal.innerText = t;
            if(audioEnabled) sounds.clock.play().catch(e=>{});
            let intv = setInterval(() => { t--; tVal.innerText = t; if(t <= 0) { clearInterval(intv); tDiv.style.display = 'none'; } }, 1000);
        });

        socket.on('playEffect', type => {
            if(type === 'shake') { document.body.style.animation = 'shake 0.5s'; setTimeout(() => document.body.style.animation = '', 500); if(audioEnabled) sounds.shake.play().catch(e=>{}); }
        });

        socket.on('gameOver', () => {
            isGameRunning = false; document.getElementById('gameView').style.display = 'none'; document.getElementById('lobbyView').style.display = 'flex';
            document.getElementById('lobbyStatus').innerText = "המשחק הסתיים! ממתינים לסיבוב הבא...";
        });

        // 🚨 מערכת הודעות חירום ממנהל העל
        socket.on('sysMessage', handleSysMsg);
        function handleSysMsg(data) {
            document.getElementById('sysAlertText').innerText = data.msg;
            document.getElementById('sysAlertModal').style.display = 'block';
            if(data.allowReply) { document.getElementById('sysAlertReply').style.display = 'block'; document.getElementById('sysAlertSendBtn').style.display = 'block'; } 
            else { document.getElementById('sysAlertReply').style.display = 'none'; document.getElementById('sysAlertSendBtn').style.display = 'none'; }
        }
        function sendSysReply() {
            const reply = document.getElementById('sysAlertReply').value;
            if(reply) {
                let pin = document.getElementById('roomIdInput').value || 'לא ידוע';
                socket.emit('submitMessage', { name: "תגובה מחדר טריוויה (PIN: " + pin + ")", text: reply });
                document.getElementById('sysAlertModal').style.display = 'none'; document.getElementById('sysAlertReply').value = ''; alert('נשלח בהצלחה להנהלה!');
            }
        }
    </script>
</body>
</html>
