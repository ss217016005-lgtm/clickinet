<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Clickinet | מסך קהל</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; transition: background 0.5s; }
        #joinBox { background: #1e293b; padding: 40px; border-radius: 20px; text-align: center; border: 2px solid #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); position: relative;}
        .logout-btn { position: absolute; left: 15px; top: 15px; background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }
        input { padding: 15px; font-size: 1.5rem; text-align: center; border-radius: 10px; border: none; margin-bottom: 20px; }
        button { background: #38bdf8; color: black; border: none; padding: 15px 40px; font-size: 1.5rem; border-radius: 10px; cursor: pointer; font-weight: bold; }
        
        #gameBox { display: none; width: 90%; max-width: 1000px; text-align: center; position: relative;}
        h1#questionText { font-size: 4rem; text-shadow: 0 0 20px rgba(56,189,248,0.8); margin-bottom: 40px; color: #fff;}
        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .answer-box { background: rgba(30,41,59,0.9); padding: 30px; border-radius: 15px; font-size: 2.5rem; font-weight: bold; border: 3px solid #334155; transition: all 0.3s; }
        .answer-box span { display: inline-block; background: #38bdf8; color: #000; width: 40px; height: 40px; line-height: 40px; border-radius: 50%; font-size: 1.5rem; margin-left: 15px; }
        
        .correct-answer { background: #10b981 !important; border-color: #fff !important; color: #fff !important; transform: scale(1.05); box-shadow: 0 0 40px rgba(16, 185, 129, 0.8); animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1.05); } 50% { transform: scale(1.1); } 100% { transform: scale(1.05); } }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 10% { transform: translate(-1px, -2px) rotate(-1deg); } 20% { transform: translate(-3px, 0px) rotate(1deg); } 30% { transform: translate(3px, 2px) rotate(0deg); } 40% { transform: translate(1px, -1px) rotate(1deg); } 50% { transform: translate(-1px, 2px) rotate(-1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 70% { transform: translate(3px, 1px) rotate(-1deg); } 80% { transform: translate(-1px, -1px) rotate(1deg); } 90% { transform: translate(1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }
    </style>
</head>
<body onclick="enableAudio()">

    <div id="joinBox">
        <h1 style="font-size: 3rem; margin-top: 0;">קליקינט</h1>
        <p style="color: #94a3b8; font-size: 1.2rem;">הזן קוד משחק להצגת המסך</p>
        <input type="text" id="roomIdInput" placeholder="קוד משחק...">
        <br>
        <button onclick="joinRoom()">הצג מסך קהל</button>
    </div>

    <div id="gameBox">
        <button class="logout-btn" style="position: absolute; left: 0; top: -50px;" onclick="logout()">יציאה</button>
        
        <div id="timerDisplay" style="font-size: 3rem; color: #f97316; font-weight: bold; margin-bottom: 10px; display: none;">⏳ <span id="timeVal">15</span></div>
        <h1 id="questionText">ממתין לשאלה...</h1>
        <div class="answers-grid">
            <div class="answer-box" id="ans-1"><span>1</span> <span id="text-1" style="background:none; color:inherit; width:auto;"></span></div>
            <div class="answer-box" id="ans-2"><span>2</span> <span id="text-2" style="background:none; color:inherit; width:auto;"></span></div>
            <div class="answer-box" id="ans-3"><span>3</span> <span id="text-3" style="background:none; color:inherit; width:auto;"></span></div>
            <div class="answer-box" id="ans-4"><span>4</span> <span id="text-4" style="background:none; color:inherit; width:auto;"></span></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let audioEnabled = false;

        const sounds = {
            victory: new Audio('https://actions.google.com/sounds/v1/crowds/crowd_cheer.ogg'),
            shake: new Audio('https://actions.google.com/sounds/v1/alarms/bugle_tune.ogg'),
            clock: new Audio('https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg'),
            tada: new Audio('https://actions.google.com/sounds/v1/cartoon/pop.ogg') 
        };

        // התחברות אוטומטית אחרי ריענון!
        window.onload = () => {
            const savedRoom = sessionStorage.getItem('clickinetPlayerRoom');
            if (savedRoom) {
                document.getElementById('roomIdInput').value = savedRoom;
                joinRoom();
            }
        };

        function enableAudio() { audioEnabled = true; }

        function joinRoom() {
            const roomId = document.getElementById('roomIdInput').value;
            if(roomId) socket.emit('joinRoom', roomId);
        }

        function logout() {
            sessionStorage.removeItem('clickinetPlayerRoom');
            location.reload();
        }

        socket.on('loginResponse', res => {
            if(res.success) {
                sessionStorage.setItem('clickinetPlayerRoom', document.getElementById('roomIdInput').value); // שמירה בזיכרון
                document.getElementById('joinBox').style.display = 'none';
                document.getElementById('gameBox').style.display = 'block';
            } else { 
                alert(res.error); 
                sessionStorage.removeItem('clickinetPlayerRoom');
            }
        });

        socket.on('newQuestion', q => {
            document.getElementById('questionText').innerText = q.q;
            document.getElementById('text-1').innerText = q.a1;
            document.getElementById('text-2').innerText = q.a2;
            document.getElementById('text-3').innerText = q.a3;
            document.getElementById('text-4').innerText = q.a4;
            
            for(let i=1; i<=4; i++) {
                document.getElementById('ans-'+i).classList.remove('correct-answer');
            }
        });

        socket.on('showCorrectAnswer', ansNumber => {
            const correctDiv = document.getElementById('ans-' + ansNumber);
            if(correctDiv) {
                correctDiv.classList.add('correct-answer');
                if(audioEnabled) sounds.tada.play().catch(e=>{});
            }
        });

        socket.on('startCountdown', sec => {
            let t = sec;
            const tDiv = document.getElementById('timerDisplay');
            const tVal = document.getElementById('timeVal');
            tDiv.style.display = 'block';
            tVal.innerText = t;
            if(audioEnabled) sounds.clock.play().catch(e=>{});
            
            let intv = setInterval(() => {
                t--; tVal.innerText = t;
                if(t <= 0) { clearInterval(intv); tDiv.style.display = 'none'; }
            }, 1000);
        });

        socket.on('playEffect', type => {
            if(type === 'shake') {
                document.body.style.animation = 'shake 0.5s';
                setTimeout(() => document.body.style.animation = '', 500);
                if(audioEnabled) sounds.shake.play().catch(e=>{});
            }
        });

        socket.on('setBg', bg => {
            if(bg === 'space') document.body.style.background = '#000 url("https://www.transparenttextures.com/patterns/stardust.png")';
            else if(bg === 'fire') document.body.style.background = '#7f1d1d';
            else document.body.style.background = '#0f172a';
        });
    </script>
</body>
</html>
