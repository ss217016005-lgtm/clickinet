<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>האזור האישי</title>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* מסך ההתחברות הלבן והחלק */
        #login-screen { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; background: #fff; }
        #login-input { border: 1px solid #ccc; outline: none; padding: 10px; font-size: 16px; width: 200px; text-align: center; border-radius: 4px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        
        /* הפאנל הפנימי */
        #dashboard { display: none; width: 90%; max-width: 1000px; background: #f9f9f9; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); align-items: flex-start; gap: 20px; flex-wrap: wrap; }
        .card { background: #fff; flex: 1; min-width: 250px; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { margin-top: 0; border-bottom: 2px solid #333; padding-bottom: 5px; }
        
        input[type="text"], input[type="password"] { width: 80%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #555; }
        .delete-btn { background: #d9534f; padding: 4px 8px; font-size: 12px; margin-right: 10px; }
        .delete-btn:hover { background: #c9302c; }
        
        ul { list-style: none; padding: 0; }
        li { background: #f1f1f1; margin-bottom: 8px; padding: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        a { color: #0066cc; text-decoration: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <input type="password" id="login-input" placeholder="...">
    </div>

    <div id="dashboard">
        <div class="card">
            <h3>קישורים מועדפים</h3>
            <input type="text" id="link-name" placeholder="שם האתר">
            <input type="text" id="link-url" placeholder="http://...">
            <button onclick="addLink()">הוסף</button>
            <ul id="links-list"></ul>
        </div>

        <div class="card">
            <h3>סיסמאות</h3>
            <input type="text" id="pass-desc" placeholder="תיאור (למשל: בנק)">
            <input type="text" id="pass-val" placeholder="סיסמה">
            <button onclick="addPass()">הוסף</button>
            <ul id="pass-list"></ul>
        </div>

        <div class="card">
            <h3>מטלות (To-Do)</h3>
            <input type="text" id="task-val" placeholder="מה צריך לעשות?">
            <button onclick="addTask()">הוסף</button>
            <ul id="tasks-list"></ul>
        </div>

        <div class="card">
            <h3>אחסון קבצים</h3>
            <input type="file" id="file-input" style="margin-bottom:10px;">
            <button onclick="uploadFile()">העלה קובץ</button>
            <ul id="files-list"></ul>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentData = { links: [], passwords: [], tasks: [], files: [] };

        // טיפול במסך כניסה
        const loginInput = document.getElementById('login-input');
        loginInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                socket.emit('deskLogin', loginInput.value);
            }
        });

        socket.on('deskError', () => {
            loginInput.value = '';
            loginInput.style.borderColor = 'red';
            setTimeout(() => loginInput.style.borderColor = '#ccc', 1000);
        });

        socket.on('deskData', (data) => {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            document.body.style.background = '#e9e9e9';
            currentData = data;
            renderAll();
        });

        // פונקציות הוספה
        function addLink() {
            let name = document.getElementById('link-name').value;
            let url = document.getElementById('link-url').value;
            if(name && url) {
                currentData.links.push({name, url});
                socket.emit('deskUpdateData', currentData);
                document.getElementById('link-name').value = ''; document.getElementById('link-url').value = '';
            }
        }

        function addPass() {
            let desc = document.getElementById('pass-desc').value;
            let val = document.getElementById('pass-val').value;
            if(desc && val) {
                currentData.passwords.push({desc, val});
                socket.emit('deskUpdateData', currentData);
                document.getElementById('pass-desc').value = ''; document.getElementById('pass-val').value = '';
            }
        }

        function addTask() {
            let val = document.getElementById('task-val').value;
            if(val) {
                currentData.tasks.push(val);
                socket.emit('deskUpdateData', currentData);
                document.getElementById('task-val').value = '';
            }
        }

        function uploadFile() {
            const fileInput = document.getElementById('file-input');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    socket.emit('deskUploadFile', { name: file.name, base64: e.target.result });
                    fileInput.value = '';
                };
                reader.readAsDataURL(file);
            }
        }

        // פונקציות מחיקה
        function delItem(type, index) {
            if(type === 'files') {
                socket.emit('deskDeleteFile', index);
            } else {
                currentData[type].splice(index, 1);
                socket.emit('deskUpdateData', currentData);
            }
        }

        // רינדור (הצגה)
        function renderAll() {
            document.getElementById('links-list').innerHTML = currentData.links.map((item, i) => `<li><a href="${item.url}" target="_blank">${item.name}</a> <button class="delete-btn" onclick="delItem('links', ${i})">מחק</button></li>`).join('');
            document.getElementById('pass-list').innerHTML = currentData.passwords.map((item, i) => `<li>${item.desc}: <strong>${item.val}</strong> <button class="delete-btn" onclick="delItem('passwords', ${i})">מחק</button></li>`).join('');
            document.getElementById('tasks-list').innerHTML = currentData.tasks.map((item, i) => `<li>${item} <button class="delete-btn" onclick="delItem('tasks', ${i})">מחק</button></li>`).join('');
            document.getElementById('files-list').innerHTML = currentData.files.map((item, i) => `<li><a href="${item.url}" target="_blank">${item.name}</a> <button class="delete-btn" onclick="delItem('files', ${i})">מחק</button></li>`).join('');
        }
    </script>
</body>
</html>
