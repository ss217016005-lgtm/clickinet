<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>חמ"ל מנכ"ל - Clickinet</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0b0f19; color: #f8fafc; margin: 0; padding: 20px; }
        .login-box { text-align: center; margin-top: 100px; }
        input, textarea, select { padding: 10px; font-size: 1.1rem; border-radius: 8px; border: 1px solid #475569; background: #1e293b; color: white; margin: 5px; width: calc(100% - 25px); }
        button { padding: 10px 20px; font-size: 1.1rem; border-radius: 8px; border: none; background: #38bdf8; color: black; cursor: pointer; font-weight: bold; margin: 5px; transition: 0.2s;}
        button:hover { filter: brightness(1.1); }
        #dashboard { display: none; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-bottom: 20px;}
        .panel { background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: center; }
        th { background: #0f172a; color: #38bdf8; }
        .btn-danger { background: #ef4444; color: white; padding: 5px 10px; font-size: 0.9rem; }
        .live-room { background: #0f172a; border: 1px solid #10b981; padding: 15px; margin-bottom: 10px; border-radius: 8px; position: relative;}
        .msg-box { background: rgba(56, 189, 248, 0.1); border-right: 4px solid #38bdf8; padding: 15px; margin-bottom: 10px; border-radius: 5px;}
        .report-box { background: rgba(239, 68, 68, 0.1); border-right: 4px solid #ef4444; }
        .stat-box { background: #0f172a; padding: 15px; border-radius: 10px; text-align: center; flex: 1; border: 1px solid #475569; }
        .stat-num { font-size: 2.5rem; font-weight: bold; margin-top: 5px; }
        .ad-list-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 5px; border: 1px solid #334155;}
        .ad-list-item img { height: 40px; border-radius: 5px; margin-left: 10px;}
    </style>
</head>
<body>

    <div id="loginArea" class="login-box">
        <h1 style="color: #38bdf8;">חמ"ל מנכ"ל 🔐</h1>
        <input type="password" id="superPass" placeholder="סיסמת מנהל..." style="width:300px;">
        <br><button onclick="superLogin()">היכנס לחמ"ל</button>
    </div>

    <div id="dashboard">
        <h1 style="text-align: center; color: #38bdf8;">🛡️ מערכת ניטור ושליטה ארצית</h1>
        
        <div class="panel" style="border-color: #38bdf8; margin-bottom: 20px;">
            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                <div class="stat-box"><div style="color:#94a3b8;">🌐 קליקינט (האב)</div><div class="stat-num" id="countPortal" style="color:#10b981;">0</div></div>
                <div class="stat-box"><div style="color:#94a3b8;">📺 טריוויה</div><div class="stat-num" id="countAudience" style="color:#eab308;">0</div></div>
                <div class="stat-box"><div style="color:#94a3b8;">⚔️ זירה</div><div class="stat-num" id="countArena" style="color:#ef4444;">0</div></div>
                <div class="stat-box" style="border-color:#f59e0b;"><div style="color:#94a3b8;">🖱️ קליקים לפרסומות</div><div class="stat-num" id="countAdClicks" style="color:#f59e0b;">0</div></div>
            </div>
        </div>

        <div class="grid">
            <div class="panel">
                <h2 style="margin-top:0; color:#eab308;">📢 הודעות למסך קליקינט</h2>
                <label style="color:#10b981;">הודעה קבועה (מתחת לכותרת):</label>
                <textarea id="sysMsgPerm" rows="2" placeholder="ברוכים הבאים למערכת ההפעלות..."></textarea>
                
                <label style="color:#ef4444;">הודעה זמנית / חירום (פס אדום בראש המסך):</label>
                <textarea id="sysMsgTemp" rows="2" placeholder="למשל: עקב עומס ייתכנו עיכובים..."></textarea>
                
                <button style="width: 100%; background: #38bdf8;" onclick="updatePortalMsgs()">שמור הודעות למסך</button>
            </div>

            <div class="panel" style="border-color: #f59e0b;">
                <h2 style="margin-top:0; color:#f59e0b;">🛒 ניהול פרסומות (קליקינט)</h2>
                <select id="adCatSelect">
                    <option value="projectors">🎥 מקרנים ומסכים</option>
                    <option value="computers">💻 מחשבים ואביזרים</option>
                    <option value="phones">📱 פלאפונים ותקשורת</option>
                    <option value="general">✨ כללי</option>
                </select>
                <input type="text" id="adLinkInput" placeholder="קישור לחיצה (למשל: mailto:test@gmail.com)">
                <input type="file" id="adImageFile" accept="image/*">
                <button style="width: 100%; background: #f59e0b; color: black;" onclick="addAd()">➕ הוסף פרסומת לקטגוריה</button>
                
                <div id="adsListArea" style="max-height: 150px; overflow-y: auto; margin-top: 15px;"></div>
            </div>
        </div>

        <div class="grid">
            <div class="panel" style="border-color: #ef4444;">
                <h2 style="margin-top:0; color:#ef4444;">🚨 תקלות ובקשות קשר</h2>
                <div id="reportsArea" style="max-height: 150px; overflow-y: auto; margin-bottom: 10px;"></div>
                <div id="messagesArea" style="max-height: 150px; overflow-y: auto;"></div>
            </div>

            <div class="panel" style="border-color: #10b981;">
                <h2 style="margin-top:0; color:#10b981;">🎫 ייצור וואוצ'רים</h2>
                <input type="text" id="vCode" placeholder="למשל: FREE2026">
                <select id="vType"><option value="regular">רגיל</option><option value="premium">פרימיום</option><option value="gold">👑 זהב</option></select>
                <input type="number" id="vDays" placeholder="תוקף בימים">
                <input type="checkbox" id="vIsPublic" style="width: auto;"> <label style="color:#10b981;">קוד ציבורי (רב-פעמי)</label>
                <button style="width: 100%; background: #10b981; color: white;" onclick="createVoucher()">ייצר וואוצ'ר</button>
            </div>
        </div>

        <div class="panel">
            <h2 style="margin-top:0;">🎫 וואוצ'רים פעילים במערכת</h2>
            <div style="max-height: 200px; overflow-y: auto;">
                <table><thead><tr><th>קוד אישור</th><th>סוג</th><th>ימים</th><th>סטטוס / שימושים</th><th>מחק</th></tr></thead><tbody id="vouchersBody"></tbody></table>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let allAds = {};

        function superLogin() { socket.emit('superLogin', document.getElementById('superPass').value); }
        socket.on('superError', () => alert('סיסמה שגויה!'));
        
        socket.on('superData', (data) => {
            document.getElementById('loginArea').style.display = 'none'; document.getElementById('dashboard').style.display = 'block';
            
            if(data.analytics) { document.getElementById('countPortal').innerText = data.analytics.portal || 0; document.getElementById('countAudience').innerText = data.analytics.audience || 0; document.getElementById('countArena').innerText = data.analytics.arena || 0; document.getElementById('countAdmin').innerText = data.analytics.admin || 0; document.getElementById('countAdClicks').innerText = data.analytics.adClicks || 0; }

            // פיצול הודעות
            if(data.portalMsg) {
                document.getElementById('sysMsgPerm').value = data.portalMsg.permanent || "";
                document.getElementById('sysMsgTemp').value = data.portalMsg.temporary || "";
            }
            
            // טעינת פרסומות
            allAds = data.ads || { projectors: [], computers: [], phones: [], general: [] };
            renderAdsList();

            const msgArea = document.getElementById('messagesArea'); const reportsArea = document.getElementById('reportsArea'); msgArea.innerHTML = ''; reportsArea.innerHTML = '';
            (data.messages || []).forEach((m, index) => { 
                let isReport = m.text.includes('[🚨 דיווח תקלה]'); let cleanText = m.text.replace('[🚨 דיווח תקלה]:', '').replace('[🚨 דיווח תקלה]', '').trim();
                let html = `<div class="msg-box ${isReport ? 'report-box' : ''}"><div style="font-size:0.8rem; color:#94a3b8;">${m.date} | ${m.name}</div><div>${cleanText}</div><button class="btn-danger" onclick="deleteMsg(${index})">מחק</button></div>`;
                if (isReport) { reportsArea.innerHTML += html; } else { msgArea.innerHTML += html; }
            });

            const vouchTbody = document.getElementById('vouchersBody'); vouchTbody.innerHTML = '';
            for (let code in data.vouchers) {
                let v = data.vouchers[code]; let t = v.type === 'gold' ? '👑 זהב' : 'רגיל';
                let s = v.isPublic ? `<span style="color:#3b82f6;">ציבורי (${v.usesCount||0} שימושים)</span>` : (v.used ? `<span style="color:#ef4444">שומש</span>` : `<span style="color:#10b981">פנוי</span>`);
                vouchTbody.innerHTML += `<tr><td><b>${code}</b></td><td>${t}</td><td>${v.days}</td><td>${s}</td><td><button class="btn-danger" onclick="deleteVoucher('${code}')">X</button></td></tr>`;
            }
        });

        function updatePortalMsgs() { socket.emit('updatePortalMsgs', { perm: document.getElementById('sysMsgPerm').value, temp: document.getElementById('sysMsgTemp').value }); alert("הודעות עודכנו!"); }
        
        function addAd() {
            const cat = document.getElementById('adCatSelect').value;
            const link = document.getElementById('adLinkInput').value;
            const fileInput = document.getElementById('adImageFile');
            if(fileInput.files.length > 0) {
                const reader = new FileReader(); reader.onload = e => { socket.emit('addAd', { category: cat, imgBase64: e.target.result, link: link }); fileInput.value=''; document.getElementById('adLinkInput').value=''; alert('נוסף בהצלחה!'); }; reader.readAsDataURL(fileInput.files[0]);
            } else { alert("נא לבחור תמונה!"); }
        }

        function renderAdsList() {
            const area = document.getElementById('adsListArea'); area.innerHTML = '';
            const catNames = { projectors: 'מקרנים', computers: 'מחשבים', phones: 'פלאפונים', general: 'כללי' };
            ['projectors', 'computers', 'phones', 'general'].forEach(cat => {
                if(allAds[cat] && allAds[cat].length > 0) {
                    allAds[cat].forEach((ad, idx) => {
                        area.innerHTML += `<div class="ad-list-item"><div style="display:flex; align-items:center;"><img src="${ad.img}"><span style="color:#cbd5e1; font-size:0.9rem;">[${catNames[cat]}] קישור: ${ad.link || 'אין'}</span></div><button class="btn-danger" style="margin:0;" onclick="deleteAd('${cat}', ${idx})">מחק</button></div>`;
                    });
                }
            });
        }
        function deleteAd(cat, idx) { if(confirm('למחוק פרסומת?')) socket.emit('deleteAd', { category: cat, index: idx }); }

        function createVoucher() { const c = document.getElementById('vCode').value.trim(); const t = document.getElementById('vType').value; const d = document.getElementById('vDays').value; const isPub = document.getElementById('vIsPublic').checked; if(!c || !d) return; socket.emit('createVoucher', { code:c, type:t, days:d, isPublic: isPub }); document.getElementById('vCode').value = ''; document.getElementById('vIsPublic').checked = false; }
        function deleteVoucher(code) { if(confirm('למחוק וואוצ\'ר?')) socket.emit('deleteVoucher', code); }
        function deleteMsg(index) { if(confirm('למחוק?')) socket.emit('deleteMessage', index); }
    </script>
</body>
</html>
