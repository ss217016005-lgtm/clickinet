<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Clickinet | חדר בקרה Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0f19; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #loginBox { background: #1e293b; padding: 40px; border-radius: 20px; text-align: center; border: 2px solid #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); }
        .login-input { width: 300px; padding: 15px; font-size: 1.5rem; text-align: center; margin-bottom: 20px; border-radius: 10px; border: none; }
        .login-btn { background: #10b981; color: white; border: none; padding: 15px 40px; font-size: 1.5rem; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #mainDashboard { display: none; } 
        h1 { text-align: center; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); margin-bottom: 5px; position: relative;}
        .logout-btn { position: absolute; left: 0; top: 0; background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .room-indicator { text-align: center; color: #10b981; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .panel { background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        h2 { border-bottom: 2px solid #38bdf8; padding-bottom: 10px; margin-top: 0; font-size: 1.5rem; }
        button { background: #2563eb; color: white; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; transition: all 0.2s; font-size: 1rem; width: calc(50% - 14px); }
        .btn-full { width: calc(100% - 10px); }
        .btn-danger { background: #ef4444; } .btn-success { background: #10b981; } .btn-effect { background: #8b5cf6; } .btn-bg { background: #f59e0b; color: #000; }
        input, select { width: calc(100% - 22px); padding: 10px; margin: 5px 0 15px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        .status-box { background: #000; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1.2rem; color: #10b981; text-align: center; margin-bottom: 15px;}
        .timer-controls { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; border: 1px solid #f97316; margin-top: 10px;}
        .timer-controls input { width: 60px; text-align: center; margin: 0; font-size: 1.2rem; font-weight: bold;}
        .player-edit-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-right: 3px solid #38bdf8; }
        .player-edit-row input { margin: 0; padding: 8px; flex-grow: 1; font-size: 1rem; }
        .score-breakdown { width: 100%; font-size: 0.85rem; color: #cbd5e1; margin-top: 5px; text-align: right; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 4px;}
        .gold-feature { background: rgba(234, 179, 8, 0.1); border: 1px dashed #eab308; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="loginOverlay">
        <div id="loginBox">
            <h1 style="font-size: 3rem; margin-top: 0;">התחברות מפיק</h1>
            <input type="text" id="roomIdInput" class="login-input" placeholder="קוד מפיק...">
            <br>
            <button class="login-btn" onclick="joinRoom()">היכנס לחדר הבקרה</button>
        </div>
    </div>

    <div id="mainDashboard">
        <h1>
            🎛️ חדר בקרה - Clickinet Pro
            <button class="logout-btn" onclick="logout()">🚪 התנתק</button>
        </h1>
        <div class="room-indicator">
            קוד משחק: <span id="displayRoomId" style="color:#fff; margin-right: 15px;">---</span> | 
            <span style="color: #eab308; margin-right: 15px;">משחקים שנותרו: <span id="displayGamesLeft">3</span></span>
        </div>
        
        <div class="grid">
            <div class="panel">
                <h2>🎮 ניהול משחק</h2>
                <div class="status-box">סטטוס מענה: <span id="lockStatusDisplay" style="color:#ef4444;">סגור 🔒</span></div>
                <button class="btn-full btn-success" onclick="startGame()">▶️ התחל משחק / אפס ניקוד</button>
                <div style="display: flex; gap: 10px; margin-bottom: 5px;">
                    <button class="btn-full" style="background: #64748b;" onclick="prevQuestion()">⏮️ שאלה קודמת</button>
                    <button class="btn-full" onclick="nextQuestion()">⏭️ שאלה הבאה</button>
                </div>
                <button class="btn-success" onclick="toggleLock(false)">🔓 פתח ידנית</button>
                <button class="btn-danger" onclick="toggleLock(true)">🔒 סגור ידנית</button>
                <button class="btn-full" style="background:#8b5cf6; margin-top: 10px;" onclick="revealAnswer()">👁️ חשוף תשובה נכונה</button>
                <div class="timer-controls">
                    <span>שניות:</span><input type="number" id="timerInput" value="15" min="3" max="120">
                    <button class="btn-full" style="background:#f97316; margin:0;" onclick="startTimer()">⏱️ פתח עם שעון!</button>
                </div>
            </div>

            <div class="panel">
                <h2>📝 הזנת שאלות למחסנית</h2>
                <input type="text" id="qText" placeholder="שאלה...">
                <div class="gold-feature">
                    <label style="color: #eab308; font-weight: bold; font-size: 0.9rem;">👑 תמונה (זהב בלבד):</label>
                    <input type="file" id="qImage" accept="image/*" style="width: 90%; margin-top: 5px;" disabled>
                </div>
                <div style="display:flex; gap:10px;"><input type="text" id="a1" placeholder="תשובה 1"><input type="text" id="a2" placeholder="תשובה 2"></div>
                <div style="display:flex; gap:10px;"><input type="text" id="a3" placeholder="תשובה 3"><input type="text" id="a4" placeholder="תשובה 4"></div>
                <input type="number" id="correct" placeholder="נכונה (1-4)" min="1" max="4">
                <button class="btn-full btn-success" onclick="addQuestion()">➕ הוסף למחסנית</button>
                <p style="text-align: center; margin-bottom: 5px;">שאלות: <span id="qCount" style="color:#38bdf8; font-weight:bold;">0</span></p>
                <button class="btn-full btn-danger" onclick="clearCurrentQuestions()">🗑️ מחק הכל</button>
                <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px dashed #38bdf8;">
                    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" style="width: 90%;">
                    <button class="btn-full" style="background: #38bdf8; color: #000;" onclick="uploadExcel()">⬆️ העלה אקסל</button>
                </div>
            </div>

            <div class="panel">
                <h2>👥 ניהול קהל</h2>
                <div id="adminPlayersList" style="max-height: 400px; overflow-y: auto;"></div>
            </div>

            <div class="panel">
                <h2>💰 חבילת מנוי</h2>
                <button class="btn-full" id="premiumBtn" style="background: #ef4444;" disabled>טוען סטטוס...</button>
                <hr style="border-color: #334155;">
                <button class="btn-bg" onclick="sendBackground('studio')">🎙️ אולפן</button> 
                <button class="btn-bg" onclick="sendBackground('matrix')">💻 מאטריקס</button>
                <button class="btn-effect" onclick="sendEffect('confetti')">🎉 קונפטי</button> 
                <button class="btn-effect" onclick="sendEffect('shake')">🌩️ רעידה</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomId = "";

        window.onload = () => {
            const savedRoom = sessionStorage.getItem('clickinetAdminRoom');
            if (savedRoom) { document.getElementById('roomIdInput').value = savedRoom; joinRoom(); }
        };

        function joinRoom() {
            const input = document.getElementById('roomIdInput').value.trim();
            if (!input) return;
            myRoomId = input; socket.emit('joinRoom', myRoomId);
        }

        function logout() { sessionStorage.removeItem('clickinetAdminRoom'); location.reload(); }

        socket.on('loginResponse', (res) => {
            if (res.success) {
                sessionStorage.setItem('clickinetAdminRoom', myRoomId);
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                document.getElementById('displayRoomId').innerText = myRoomId;
                document.getElementById('displayGamesLeft').innerText = res.gamesLeft;
            } else { alert(res.error); sessionStorage.removeItem('clickinetAdminRoom'); }
        });

        socket.on('updateSettings', s => { 
            const pBtn = document.getElementById('premiumBtn');
            const fileInput = document.getElementById('qImage');
            if(s.isGold) { 
                pBtn.innerText = '👑 פרימיום זהב: פעיל!'; pBtn.style.background = '#eab308'; pBtn.style.color = '#000';
                fileInput.disabled = false;
            } else if(s.isPremium) { 
                pBtn.innerText = '💎 פרימיום: מופעל!'; pBtn.style.background = '#38bdf8'; pBtn.style.color = '#000';
                fileInput.disabled = true;
            } else { 
                pBtn.innerText = 'רגיל (עד 10 משתתפים)'; pBtn.style.background = '#ef4444'; pBtn.style.color = '#fff';
                fileInput.disabled = true;
            }
        });

        socket.on('updateLeaderboard', players => {
            const adminList = document.getElementById('adminPlayersList');
            adminList.innerHTML = '';
            let sortedPlayers = Object.entries(players).sort((a,b) => b[1].score - a[1].score);
            for (let [phone, p] of sortedPlayers) {
                adminList.innerHTML += `<div class="player-edit-row"><span>${phone}</span><input type="text" id="name_${phone}" value="${p.name}"><button onclick="saveName('${phone}')">💾</button><div class="score-breakdown"><strong>${p.score}</strong> | ${p.lastBreakdown || ''}</div></div>`;
            }
        });

        function saveName(phone) { const newName = document.getElementById('name_' + phone).value; socket.emit('updatePlayerName', { phone, newName }); }
        function addQuestion() { 
            const fileInput = document.getElementById('qImage');
            const q = { q: document.getElementById('qText').value, a1: document.getElementById('a1').value, a2: document.getElementById('a2').value, a3: document.getElementById('a3').value, a4: document.getElementById('a4').value, ans: document.getElementById('correct').value }; 
            if(fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = e => { q.imgBase64 = e.target.result; socket.emit('addSingleQuestion', q); document.getElementById('qText').value = ''; fileInput.value = ''; alert('נוסף!'); };
                reader.readAsDataURL(fileInput.files[0]);
            } else { socket.emit('addSingleQuestion', q); document.getElementById('qText').value = ''; alert('נוסף!'); }
        }
        function startGame() { socket.emit('startGame'); }
        function nextQuestion() { socket.emit('nextQuestion'); }
        function prevQuestion() { socket.emit('prevQuestion'); } 
        function toggleLock(state) { socket.emit('toggleLock', state); }
        function revealAnswer() { socket.emit('revealAnswer'); } 
        function sendEffect(type) { socket.emit('triggerEffect', type); }
        function sendBackground(bg) { socket.emit('changeBackground', bg); }
        function startTimer() { socket.emit('startTimer', parseInt(document.getElementById('timerInput').value)); }
        function uploadExcel() { /* פונקציית אקסל הקודמת... */ }
    </script>
</body>
</html>
