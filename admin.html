<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Clickinet | חדר בקרה Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0f19; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #loginBox { background: #1e293b; padding: 40px; border-radius: 20px; text-align: center; border: 2px solid #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); }
        .login-input { width: 300px; padding: 15px; font-size: 1.5rem; text-align: center; margin-bottom: 20px; border-radius: 10px; border: none; }
        .login-btn { background: #10b981; color: white; border: none; padding: 15px 40px; font-size: 1.5rem; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #mainDashboard { display: none; } 
        h1 { text-align: center; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); margin-bottom: 5px; position: relative;}
        .logout-btn { position: absolute; left: 0; top: 0; background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .room-indicator { text-align: center; color: #10b981; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .panel { background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
        h2 { border-bottom: 2px solid #38bdf8; padding-bottom: 10px; margin-top: 0; font-size: 1.5rem; }
        button { background: #2563eb; color: white; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; transition: all 0.2s; font-size: 1rem; width: calc(50% - 14px); }
        .btn-full { width: calc(100% - 10px); }
        .btn-danger { background: #ef4444; } .btn-success { background: #10b981; } .btn-effect { background: #8b5cf6; } .btn-bg { background: #f59e0b; color: #000; }
        .btn-radar { background: #14b8a6; color: #fff; } .btn-radar-go { background: #ef4444; font-size: 1.3rem; }
        .btn-victory { background: linear-gradient(90deg, #fbbf24, #f59e0b); color: #000; font-size: 1.3rem; border: 2px solid #fff; box-shadow: 0 0 15px rgba(251, 191, 36, 0.5); }
        input, select { width: calc(100% - 22px); padding: 10px; margin: 5px 0 15px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        .status-box { background: #000; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1.2rem; color: #10b981; text-align: center; margin-bottom: 15px;}
        .timer-controls { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; border: 1px solid #f97316; margin-top: 10px;}
        .timer-controls input { width: 60px; text-align: center; margin: 0; font-size: 1.2rem; font-weight: bold;}
        .player-edit-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-right: 3px solid #38bdf8; }
        .player-edit-row input { margin: 0; padding: 8px; flex-grow: 1; font-size: 1rem; }
        .player-phone { font-family: monospace; color: #94a3b8; font-size: 1.1rem; width: 110px; }
        .score-breakdown { width: 100%; font-size: 0.85rem; color: #cbd5e1; margin-top: 5px; text-align: right; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 4px; border-right: 2px solid #10b981;}
    </style>
</head>
<body>
    <div id="loginOverlay">
        <div id="loginBox">
            <h1 style="font-size: 3rem; margin-top: 0;">התחברות מפיק</h1>
            <input type="text" id="roomIdInput" class="login-input" placeholder="קוד מפיק...">
            <br>
            <button class="login-btn" onclick="joinRoom()">היכנס לחדר הבקרה</button>
        </div>
    </div>

    <div id="mainDashboard">
        <h1>
            🎛️ חדר בקרה - Clickinet Pro
            <button class="logout-btn" onclick="logout()">🚪 התנתק</button>
        </h1>
        <div class="room-indicator">
            קוד משחק: <span id="displayRoomId" style="color:#fff; margin-right: 15px;">---</span> | 
            <span style="color: #eab308; margin-right: 15px;">משחקים שנותרו: <span id="displayGamesLeft">3</span></span>
        </div>
        
        <div class="grid">
            <div class="panel">
                <h2>🎮 ניהול משחק</h2>
                <div class="status-box">סטטוס מענה: <span id="lockStatusDisplay" style="color:#ef4444;">סגור 🔒</span></div>
                <button class="btn-full btn-success" onclick="startGame()">▶️ התחל משחק / אפס ניקוד</button>
                
                <div style="display: flex; gap: 10px; margin-bottom: 5px;">
                    <button class="btn-full" style="background: #64748b;" onclick="prevQuestion()">⏮️ שאלה קודמת</button>
                    <button class="btn-full" onclick="nextQuestion()">⏭️ שאלה הבאה</button>
                </div>

                <button class="btn-success" onclick="toggleLock(false)">🔓 פתח ידנית</button>
                <button class="btn-danger" onclick="toggleLock(true)">🔒 סגור ידנית</button>
                <button class="btn-full" style="background:#8b5cf6; margin-top: 10px;" onclick="revealAnswer()">👁️ חשוף תשובה נכונה לקהל</button>

                <div class="timer-controls">
                    <span>שניות:</span><input type="number" id="timerInput" value="15" min="3" max="120">
                    <button class="btn-full" style="background:#f97316; margin:0;" onclick="startTimer()">⏱️ פתח עם שעון!</button>
                </div>
                
                <hr style="border-color: #334155; margin: 20px 0;">
                <button class="btn-full btn-victory" onclick="triggerVictory()">🏆 סיום וטקס מנצחים!</button>
                <button class="btn-full btn-danger" style="margin-top:20px;" onclick="clearPlayers()">🗑️ נתק שחקנים</button>
            </div>

            <div class="panel">
                <h2>📝 הזנת שאלות למחסנית</h2>
                <input type="text" id="qText" placeholder="שאלה...">
                <div style="display:flex; gap:10px;"><input type="text" id="a1" placeholder="תשובה 1"><input type="text" id="a2" placeholder="תשובה 2"></div>
                <div style="display:flex; gap:10px;"><input type="text" id="a3" placeholder="תשובה 3"><input type="text" id="a4" placeholder="תשובה 4"></div>
                <input type="number" id="correct" placeholder="נכונה (1-4)" min="1" max="4">
                <button class="btn-full btn-success" onclick="addQuestion()">➕ הוסף למחסנית</button>
                <p style="text-align: center; margin-bottom: 5px;">שאלות במחסנית הפעילה: <span id="qCount" style="color:#38bdf8; font-weight:bold; font-size: 1.2rem;">0</span></p>
                <button class="btn-full btn-danger" style="background: transparent; border: 1px solid #ef4444; color: #ef4444;" onclick="clearCurrentQuestions()">מחק מחסנית נוכחית</button>
                
                <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px dashed #38bdf8;">
                    <h3 style="margin-top:0; color: #38bdf8;">📁 טעינה מאקסל</h3>
                    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" style="width: 90%;">
                    <button class="btn-full" style="background: #38bdf8; color: #000;" onclick="uploadExcel()">⬆️ העלה קובץ שאלות</button>
                </div>
            </div>

            <div class="panel">
                <h2>🗂️ בנק משחקים (שמירה/טעינה)</h2>
                <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <input type="text" id="newGameName" placeholder="תן שם למשחק">
                    <button class="btn-full btn-success" onclick="saveToBank()">💾 שמור מחסנית לבנק</button>
                </div>
                <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;">
                    <select id="savedGamesList"><option value="">-- בחר משחק לטעינה --</option></select>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-full" style="background: #38bdf8; color: #000;" onclick="loadFromBank()">📂 טען למחסנית</button>
                        <button class="btn-full btn-danger" onclick="deleteFromBank()">🗑️ מחק מהבנק</button>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>👥 ניהול קהל ושקיפות ניקוד</h2>
                <div id="adminPlayersList" style="max-height: 400px; overflow-y: auto; padding-right: 5px;"></div>
            </div>

            <div class="panel">
                <h2>💰 חבילת המנוי שלך</h2>
                <button class="btn-full" id="premiumBtn" style="background: #ef4444;" disabled>💎 פרימיום: כבוי</button>
                <hr style="border-color: #334155; margin: 20px 0;">
                <h3 style="margin:0 0 10px 0; color: #14b8a6;">⏱️ מבחן מהירות (רדאר)</h3>
                <button class="btn-full btn-radar" onclick="prepareCalibration()">1. הכן קהל (הצג מסך)</button>
                <button class="btn-full btn-radar-go" onclick="startCalibration()" id="btnGo" style="display:none;">2. הזנק מבחן! (GO)</button>
                <button class="btn-full btn-danger" onclick="stopCalibration()">3. סיים והצג סטטיסטיקות</button>
            </div>

            <div class="panel">
                <h2>🎬 תפאורה ואפקטים</h2>
                <button class="btn-bg" onclick="sendBackground('studio')">🎙️ אולפן</button> <button class="btn-bg" onclick="sendBackground('matrix')">💻 מאטריקס</button>
                <button class="btn-bg" onclick="sendBackground('space')">🌌 חלל</button> <button class="btn-bg" onclick="sendBackground('fire')">🔥 אש</button>
                <hr style="border-color: #334155; margin: 15px 0;">
                <button class="btn-effect" onclick="sendEffect('confetti')">🎉 קונפטי</button> <button class="btn-effect" onclick="sendEffect('flicker')">🚨 פליקר</button>
                <button class="btn-effect" onclick="sendEffect('shake')">🌩️ רעידה</button> <button class="btn-effect" onclick="sendEffect('spotlight')">🔦 זרקור</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomId = "";

        // כשהדף נטען - בודקים אם יש התחברות שמורה
        window.onload = () => {
            const savedRoom = sessionStorage.getItem('clickinetAdminRoom');
            if (savedRoom) {
                document.getElementById('roomIdInput').value = savedRoom;
                joinRoom(); // נכנס אוטומטית!
            }
        };

        function joinRoom() {
            const input = document.getElementById('roomIdInput').value.trim();
            if (!input) return alert("חובה להזין קוד מפיק!");
            myRoomId = input;
            socket.emit('joinRoom', myRoomId);
        }

        // פונקציית התנתקות חדשה
        function logout() {
            sessionStorage.removeItem('clickinetAdminRoom'); // מוחקים את הזיכרון
            location.reload(); // מרעננים את הדף חזרה למסך פתיחה
        }

        socket.on('loginResponse', (res) => {
            if (res.success) {
                // שומרים את ההתחברות בזכרון הדפדפן כדי למנוע זריקה בריענון!
                sessionStorage.setItem('clickinetAdminRoom', myRoomId);
                
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                document.getElementById('displayRoomId').innerText = myRoomId;
                document.getElementById('displayGamesLeft').innerText = res.gamesLeft;
            } else { 
                alert(res.error); 
                sessionStorage.removeItem('clickinetAdminRoom'); // אם טעה בקוד, מוחקים
            }
        });

        socket.on('updateGamesLeft', count => { document.getElementById('displayGamesLeft').innerText = count; });
        socket.on('lockState', isLocked => {
            const display = document.getElementById('lockStatusDisplay');
            if(isLocked) { display.innerText = 'סגור 🔒'; display.style.color = '#ef4444'; } else { display.innerText = 'פתוח להצבעות! 🔥'; display.style.color = '#10b981'; }
        });
        socket.on('updateQuestions', qs => { document.getElementById('qCount').innerText = qs.length; });
        
        socket.on('updateSavedGames', games => {
            const select = document.getElementById('savedGamesList'); select.innerHTML = '<option value="">-- בחר משחק לטעינה --</option>';
            games.forEach(g => { select.innerHTML += `<option value="${g}">${g}</option>`; });
        });

        socket.on('updateLeaderboard', players => {
            const adminList = document.getElementById('adminPlayersList');
            if(Object.keys(players).length === 0) { adminList.innerHTML = '<div style="text-align: center; color: #475569; margin-top: 20px;">ממתין...</div>'; return; }
            adminList.innerHTML = '';
            let sortedPlayers = Object.entries(players).sort((a,b) => b[1].score - a[1].score);
            
            for (let [phone, p] of sortedPlayers) {
                let displayValue = (p.name === 'שחקן חדש') ? '' : p.name;
                let breakdown = p.lastBreakdown ? p.lastBreakdown : 'טרם ענה על השאלה הנוכחית';
                let scoreColor = p.lastBreakdown && p.lastBreakdown.includes('✅') ? '#10b981' : (p.lastBreakdown && p.lastBreakdown.includes('❌') ? '#ef4444' : '#cbd5e1');
                
                adminList.innerHTML += `
                    <div class="player-edit-row">
                        <span class="player-phone">${phone}</span>
                        <input type="text" id="name_${phone}" value="${displayValue}" placeholder="שם...">
                        <button style="background:#10b981;width:auto;padding:8px;margin:0;" onclick="saveName('${phone}')">💾</button>
                        <div class="score-breakdown" style="border-right-color: ${scoreColor}">
                            <strong>ניקוד כולל: ${p.score}</strong> | ${breakdown}
                        </div>
                    </div>`;
            }
        });

        function saveName(phone) { const newName = document.getElementById('name_' + phone).value; if (newName.trim() !== '') { socket.emit('updatePlayerName', { phone: phone, newName: newName }); const btn = document.querySelector(`#name_${phone}`).nextElementSibling; btn.innerText = '✔️'; setTimeout(() => btn.innerText = '💾', 2000); } }
        function startGame() { socket.emit('startGame'); }
        function nextQuestion() { socket.emit('nextQuestion'); }
        function prevQuestion() { socket.emit('prevQuestion'); } 
        function toggleLock(state) { socket.emit('toggleLock', state); }
        function revealAnswer() { socket.emit('revealAnswer'); } 
        function clearPlayers() { if(confirm('לנתק כולם?')) socket.emit('clearPlayers'); }
        function sendEffect(type) { socket.emit('triggerEffect', type); }
        function sendBackground(bg) { socket.emit('changeBackground', bg); }
        function triggerVictory() { if(confirm('לסיים ולהציג פודיום?')) socket.emit('showVictoryScreen'); }
        function prepareCalibration() { socket.emit('prepareCalibration'); document.getElementById('btnGo').style.display = 'block'; }
        function startCalibration() { socket.emit('startCalibration'); document.getElementById('btnGo').style.display = 'none'; }
        function stopCalibration() { socket.emit('endCalibration'); }
        function startTimer() { let sec = document.getElementById('timerInput').value || 15; socket.emit('startTimer', parseInt(sec)); }
        
        function saveToBank() { const name = document.getElementById('newGameName').value; const qCount = parseInt(document.getElementById('qCount').innerText); if (!name) return alert('נא להקליד שם למשחק!'); if (qCount === 0) return alert('המחסנית ריקה!'); socket.emit('saveGameToBank', name); document.getElementById('newGameName').value = ''; alert('נשמר לבנק!'); }
        function loadFromBank() { const name = document.getElementById('savedGamesList').value; if (!name) return alert('נא לבחור משחק!'); if(confirm(`לטעון את ${name}?`)) socket.emit('loadGameFromBank', name); }
        function deleteFromBank() { const name = document.getElementById('savedGamesList').value; if (!name) return alert('נא לבחור משחק למחיקה!'); if(confirm(`למחוק את ${name} לתמיד?`)) socket.emit('deleteGameFromBank', name); }
        function clearCurrentQuestions() { if(confirm('למחוק את כל השאלות מהמחסנית הפעילה כעת?')) socket.emit('clearQuestions'); }
        
        function addQuestion() { 
            const q = { q: document.getElementById('qText').value, a1: document.getElementById('a1').value, a2: document.getElementById('a2').value, a3: document.getElementById('a3').value, a4: document.getElementById('a4').value, ans: document.getElementById('correct').value }; 
            if(q.q && q.ans) { socket.emit('addSingleQuestion', q); alert('נוסף למחסנית הפעילה!'); document.getElementById('qText').value = ''; } else { alert('חסר מידע.'); } 
        }

        function uploadExcel() {
            const file = document.getElementById('excelFile').files[0];
            if (!file) return alert('נא לבחור קובץ אקסל קודם!');
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
                let newQuestions = [];
                for (let i = 1; i < rows.length; i++) { 
                    let r = rows[i];
                    if (r.length >= 6 && r[0] && r[5]) {
                        newQuestions.push({ q: String(r[0]), a1: String(r[1] || ''), a2: String(r[2] || ''), a3: String(r[3] || ''), a4: String(r[4] || ''), ans: String(r[5]) });
                    }
                }
                if (newQuestions.length > 0) {
                    socket.emit('addBulkQuestions', newQuestions);
                    alert('הועלו ' + newQuestions.length + ' שאלות בהצלחה למחסנית!');
                    document.getElementById('excelFile').value = '';
                } else { alert('לא נמצאו שאלות תקינות בקובץ.'); }
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
