<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Clickinet | חדר בקרה Pro</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0f19; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        #loginBox { background: #1e293b; padding: 40px; border-radius: 20px; text-align: center; border: 2px solid #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.3); }
        .login-input { width: 300px; padding: 15px; font-size: 1.5rem; text-align: center; margin-bottom: 20px; border-radius: 10px; border: none; }
        .login-btn { background: #10b981; color: white; border: none; padding: 15px 40px; font-size: 1.5rem; border-radius: 10px; cursor: pointer; font-weight: bold; }
        #mainDashboard { display: none; } 
        h1 { text-align: center; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); margin-bottom: 5px; position: relative;}
        .logout-btn { position: absolute; left: 0; top: 0; background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .room-indicator { text-align: center; color: #10b981; font-size: 1.2rem; font-weight: bold; margin-bottom: 20px;}
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; max-width: 1400px; margin: 0 auto; }
        .panel { background: #1e293b; padding: 20px; border-radius: 15px; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); position: relative; }
        h2 { border-bottom: 2px solid #38bdf8; padding-bottom: 10px; margin-top: 0; font-size: 1.5rem; }
        button { background: #2563eb; color: white; border: none; padding: 12px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; transition: all 0.2s; font-size: 1rem; width: calc(50% - 14px); }
        .btn-full { width: calc(100% - 10px); }
        .btn-danger { background: #ef4444; } .btn-success { background: #10b981; } .btn-effect { background: #8b5cf6; } .btn-bg { background: #f59e0b; color: #000; }
        input, select { width: calc(100% - 22px); padding: 10px; margin: 5px 0 15px 0; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        .status-box { background: #000; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 1.2rem; color: #10b981; text-align: center; margin-bottom: 15px;}
        .player-edit-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-right: 3px solid #38bdf8; }
        .player-edit-row input { margin: 0; padding: 8px; flex-grow: 1; font-size: 1rem; }
        .score-breakdown { width: 100%; font-size: 0.85rem; color: #cbd5e1; margin-top: 5px; text-align: right; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 4px;}
        .gold-feature { background: rgba(234, 179, 8, 0.1); border: 1px dashed #eab308; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .q-list-item { display:flex; justify-content:space-between; align-items:center; background:#334155; padding:8px; margin-bottom:5px; border-radius:5px; font-size:0.9rem; }
    </style>
</head>
<body>
    <div id="loginOverlay">
        <div id="loginBox">
            <h1 style="font-size: 3rem; margin-top: 0;">התחברות מפיק</h1>
            <input type="text" id="roomIdInput" class="login-input" placeholder="קוד מפיק...">
            <br>
            <button class="login-btn" onclick="joinRoom()">היכנס לחדר הבקרה</button>
        </div>
    </div>

    <div id="mainDashboard">
        <h1>
            🎛️ חדר בקרה - Clickinet Pro
            <button class="logout-btn" onclick="logout()">🚪 התנתק</button>
        </h1>
        <div class="room-indicator">
            קוד משחק: <span id="displayRoomId" style="color:#fff; margin-right: 15px;">---</span> | 
            <span style="color: #eab308; margin-right: 15px;">משחקים שנותרו: <span id="displayGamesLeft">3</span></span>
        </div>
        
        <div class="grid">
            <div class="panel">
                <h2>🎮 ניהול משחק מתקדם</h2>
                <div class="status-box">סטטוס מענה: <span id="lockStatusDisplay" style="color:#ef4444;">סגור 🔒</span></div>
                
                <button class="btn-full" style="background:#14b8a6; font-size: 1.2rem; border:2px solid #fff;" onclick="runAutoPilot()">▶️ טייס אוטומטי (שגר סייקל שלם!)</button>
                <hr style="border-color: #334155; margin: 15px 0;">

                <div style="display: flex; gap: 10px; margin-bottom: 5px;">
                    <button class="btn-full" style="background: #64748b;" onclick="prevQuestion()">⏮️ שאלה קודמת</button>
                    <button class="btn-full" onclick="nextQuestion()">⏭️ שאלה הבאה</button>
                </div>
                
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="btn-full btn-success" onclick="toggleLock(false)">🔓 פתח ידנית</button>
                    <button class="btn-full" style="background:#f97316; margin:0;" onclick="startTimer()">⏱️ פתח עם שעון (15ש)</button>
                </div>
                <button class="btn-full btn-danger" style="margin-top:10px;" onclick="toggleLock(true)">🔒 סגור מענה</button>
                
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button class="btn-full" style="background:#3b82f6;" onclick="showChart()">📊 הצג גרף הצבעות</button>
                    <button class="btn-full" style="background:#8b5cf6;" onclick="revealAnswer()">👁️ חשוף תשובה!</button>
                </div>

                <button class="btn-full" id="doubleBtn" style="background:#eab308; color:#000; margin-top:15px; border: 2px dashed #000;" onclick="toggleDouble()">✨ הפעל שאלת דאבל נקודות!</button>
                
                <hr style="border-color: #334155; margin: 15px 0;">
                <button class="btn-full btn-victory" onclick="triggerVictory()">🏆 סיום וטקס מנצחים!</button>
            </div>

            <div class="panel">
                <h2>📝 מחסנית השאלות</h2>
                <input type="text" id="qText" placeholder="שאלה...">
                <div class="gold-feature">
                    <label style="color: #eab308; font-weight: bold; font-size: 0.9rem;">👑 תמונה (זהב בלבד):</label>
                    <input type="file" id="qImage" accept="image/*" style="width: 90%; margin-top: 5px;" disabled>
                </div>
                <div style="display:flex; gap:10px;"><input type="text" id="a1" placeholder="תשובה 1"><input type="text" id="a2" placeholder="תשובה 2"></div>
                <div style="display:flex; gap:10px;"><input type="text" id="a3" placeholder="תשובה 3"><input type="text" id="a4" placeholder="תשובה 4"></div>
                <input type="number" id="correct" placeholder="נכונה (1-4)" min="1" max="4">
                <button class="btn-full btn-success" onclick="addQuestion()">➕ הוסף למחסנית</button>
                
                <div style="margin-top: 15px; max-height: 150px; overflow-y: auto; background:rgba(0,0,0,0.3); padding:10px; border-radius:8px;" id="qListItems"></div>
                <button class="btn-full btn-danger" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; margin-top:5px;" onclick="clearCurrentQuestions()">🗑️ רוקן את כל המחסנית</button>

                <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px dashed #38bdf8;">
                    <h3 style="margin-top:0; color: #38bdf8;">📁 טעינה מאקסל</h3>
                    <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" style="width: 90%;">
                    <button class="btn-full" style="background: #38bdf8; color: #000; margin-top: 10px;" onclick="uploadExcel()">⬆️ העלה קובץ שאלות</button>
                </div>
            </div>

            <div class="panel">
                <h2>👥 ניהול קהל</h2>
                <button class="btn-full btn-success" style="margin-bottom: 15px;" onclick="exportResults()">⬇️ הורד דוח תוצאות לאקסל</button>
                <div id="adminPlayersList" style="max-height: 300px; overflow-y: auto;"></div>
                <button class="btn-full btn-danger" style="margin-top:10px;" onclick="clearPlayers()">🗑️ נתק את כולם</button>
            </div>

            <div class="panel">
                <h2>👑 פינוקי פרימיום ומוזיקה</h2>
                <button class="btn-full" id="premiumBtn" style="background: #ef4444;" disabled>טוען סטטוס...</button>
                
                <div class="gold-feature" style="margin-top: 15px;">
                    <label style="color: #eab308; font-weight: bold; font-size: 0.9rem;">💼 העלה לוגו נותן חסות (קבוע במסך):</label>
                    <input type="file" id="sponsorImg" accept="image/*" style="width: 90%; margin-top: 5px;" disabled onchange="uploadSponsor()">
                </div>

                <hr style="border-color: #334155; margin: 15px 0;">
                <h3 style="margin:0 0 10px 0; color: #14b8a6;">🎵 מוזיקת רקע</h3>
                <div style="display: flex; gap: 10px;">
                    <button class="btn-full btn-success" onclick="toggleMusic(true)">▶️ נגן</button>
                    <button class="btn-full btn-danger" onclick="toggleMusic(false)">⏸️ השתק</button>
                </div>

                <hr style="border-color: #334155; margin: 15px 0;">
                <h2>🗂️ בנק משחקים</h2>
                <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <input type="text" id="newGameName" placeholder="תן שם למשחק">
                    <button class="btn-full btn-success" onclick="saveToBank()">💾 שמור לבנק</button>
                </div>
                <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;">
                    <select id="savedGamesList"><option value="">-- בחר משחק לטעינה --</option></select>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-full" style="background: #38bdf8; color: #000;" onclick="loadFromBank()">📂 טען למחסנית</button>
                        <button class="btn-full btn-danger" onclick="deleteFromBank()">🗑️ מחק</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myRoomId = "";
        let currentPlayersObj = {}; 
        let isDouble = false;

        window.onload = () => {
            const savedRoom = sessionStorage.getItem('clickinetAdminRoom');
            if (savedRoom) { document.getElementById('roomIdInput').value = savedRoom; joinRoom(); }
        };

        function joinRoom() {
            const input = document.getElementById('roomIdInput').value.trim();
            if (!input) return;
            myRoomId = input; socket.emit('joinRoom', myRoomId);
        }

        function logout() { sessionStorage.removeItem('clickinetAdminRoom'); location.reload(); }

        socket.on('loginResponse', (res) => {
            if (res.success) {
                sessionStorage.setItem('clickinetAdminRoom', myRoomId);
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainDashboard').style.display = 'block';
                document.getElementById('displayRoomId').innerText = myRoomId;
                document.getElementById('displayGamesLeft').innerText = res.gamesLeft;
            } else { alert(res.error); sessionStorage.removeItem('clickinetAdminRoom'); }
        });

        socket.on('updateSettings', s => { 
            const pBtn = document.getElementById('premiumBtn');
            const fileInput = document.getElementById('qImage');
            const sponsorInput = document.getElementById('sponsorImg');
            if(s.isGold) { 
                pBtn.innerText = '👑 פרימיום זהב: פעיל!'; pBtn.style.background = '#eab308'; pBtn.style.color = '#000';
                fileInput.disabled = false; sponsorInput.disabled = false;
            } else if(s.isPremium) { 
                pBtn.innerText = '💎 פרימיום: מופעל!'; pBtn.style.background = '#38bdf8'; pBtn.style.color = '#000';
                fileInput.disabled = true; sponsorInput.disabled = true;
            } else { 
                pBtn.innerText = 'רגיל (עד 10 משתתפים)'; pBtn.style.background = '#ef4444'; pBtn.style.color = '#fff';
                fileInput.disabled = true; sponsorInput.disabled = true;
            }
        });

        socket.on('lockState', isLocked => {
            const display = document.getElementById('lockStatusDisplay');
            if(isLocked) { display.innerText = 'סגור 🔒'; display.style.color = '#ef4444'; } else { display.innerText = 'פתוח להצבעות! 🔥'; display.style.color = '#10b981'; }
        });

        socket.on('updateSavedGames', games => {
            const select = document.getElementById('savedGamesList'); select.innerHTML = '<option value="">-- בחר משחק לטעינה --</option>';
            games.forEach(g => { select.innerHTML += `<option value="${g}">${g}</option>`; });
        });

        socket.on('updateQuestions', qs => { 
            const list = document.getElementById('qListItems');
            list.innerHTML = '';
            if(qs.length === 0) list.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:0.9rem;">המחסנית ריקה</p>';
            qs.forEach((q, i) => {
                list.innerHTML += `<div class="q-list-item"><span>${i+1}. ${q.q}</span> <button class="btn-danger" style="padding:4px 8px; margin:0;" onclick="deleteSingleQ(${i})">❌</button></div>`;
            });
            document.getElementById('qCount').innerText = qs.length;
        });
        function deleteSingleQ(index) { socket.emit('deleteSingleQuestion', index); }

        socket.on('updateLeaderboard', players => {
            currentPlayersObj = players; 
            const adminList = document.getElementById('adminPlayersList');
            adminList.innerHTML = '';
            let sortedPlayers = Object.entries(players).sort((a,b) => b[1].score - a[1].score);
            for (let [phone, p] of sortedPlayers) {
                let breakdown = p.lastBreakdown || '';
                let scoreColor = breakdown.includes('✅') ? '#10b981' : (breakdown.includes('❌') ? '#ef4444' : '#cbd5e1');
                
                // הנה השדות להקלדת שם ושמירה!
                adminList.innerHTML += `<div class="player-edit-row">
                    <span class="player-phone">${phone}</span>
                    <input type="text" id="name_${phone}" value="${p.name}">
                    <button style="background:#10b981;width:auto;padding:8px;margin:0;" onclick="saveName('${phone}')">💾</button>
                    <button style="background:#ef4444;width:auto;padding:8px;margin:0;" title="העף שחקן" onclick="kick('${phone}')">🥾</button>
                    <div class="score-breakdown" style="border-right-color: ${scoreColor}"><strong>ניקוד: ${p.score}</strong> | ${breakdown}</div>
                </div>`;
            }
        });

        function saveName(phone) { socket.emit('updatePlayerName', { phone, newName: document.getElementById('name_' + phone).value }); }
        function kick(phone) { if(confirm('לזרוק את השחקן מהחדר?')) socket.emit('kickPlayer', phone); }
        
        function exportResults() {
            if(Object.keys(currentPlayersObj).length === 0) return alert("אין נתונים להורדה.");
            let data = [["טלפון", "שם שחקן", "ניקוד סופי", "רצף נוכחי"]];
            let sorted = Object.entries(currentPlayersObj).sort((a,b) => b[1].score - a[1].score);
            for(let [phone, p] of sorted) { data.push([phone, p.name, p.score, p.streak]); }
            let ws = XLSX.utils.aoa_to_sheet(data);
            let wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "תוצאות");
            XLSX.writeFile(wb, `Clickinet_Results_${myRoomId}.xlsx`);
        }

        // --- הנה פונקציית האקסל שחזרה במלואה! ---
        function uploadExcel() {
            const file = document.getElementById('excelFile').files[0];
            if (!file) return alert('נא לבחור קובץ אקסל קודם!');
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
                let newQuestions = [];
                for (let i = 1; i < rows.length; i++) { 
                    let r = rows[i];
                    if (r.length >= 6 && r[0] && r[5]) {
                        newQuestions.push({ q: String(r[0]), a1: String(r[1] || ''), a2: String(r[2] || ''), a3: String(r[3] || ''), a4: String(r[4] || ''), ans: String(r[5]) });
                    }
                }
                if (newQuestions.length > 0) {
                    socket.emit('addBulkQuestions', newQuestions);
                    alert('הועלו ' + newQuestions.length + ' שאלות בהצלחה למחסנית!');
                    document.getElementById('excelFile').value = '';
                } else { alert('לא נמצאו שאלות תקינות בקובץ.'); }
            };
            reader.readAsArrayBuffer(file);
        }

        function runAutoPilot() {
            if(!confirm('להפעיל סייקל אוטומטי? המערכת תשאל, תפעיל שעון, תציג גרף, ותחשוף תשובה לבד.')) return;
            socket.emit('nextQuestion');
            setTimeout(() => {
                socket.emit('startTimer', 15);
                setTimeout(() => {
                    socket.emit('showChart');
                    setTimeout(() => { socket.emit('revealAnswer'); }, 4000);
                }, 16000); 
            }, 5000); 
        }

        function toggleDouble() {
            isDouble = !isDouble;
            socket.emit('toggleDoublePoints', isDouble);
            const btn = document.getElementById('doubleBtn');
            btn.style.background = isDouble ? '#000' : '#eab308';
            btn.style.color = isDouble ? '#eab308' : '#000';
            btn.innerText = isDouble ? '✨ דאבל נקודות פועל כעת! ✨' : '✨ הפעל שאלת דאבל נקודות!';
        }
        
        socket.on('doublePointsState', state => {
            isDouble = state;
            const btn = document.getElementById('doubleBtn');
            btn.style.background = isDouble ? '#000' : '#eab308';
            btn.style.color = isDouble ? '#eab308' : '#000';
            btn.innerText = isDouble ? '✨ דאבל נקודות פועל כעת! ✨' : '✨ הפעל שאלת דאבל נקודות!';
        });

        function uploadSponsor() {
            const fileInput = document.getElementById('sponsorImg');
            if(fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = e => { socket.emit('uploadSponsor', { imgBase64: e.target.result }); alert('לוגו חסות עלה בהצלחה!'); };
                reader.readAsDataURL(fileInput.files[0]);
            }
        }

        function addQuestion() { 
            const fileInput = document.getElementById('qImage');
            const q = { q: document.getElementById('qText').value, a1: document.getElementById('a1').value, a2: document.getElementById('a2').value, a3: document.getElementById('a3').value, a4: document.getElementById('a4').value, ans: document.getElementById('correct').value }; 
            if(fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = e => { q.imgBase64 = e.target.result; socket.emit('addSingleQuestion', q); document.getElementById('qText').value = ''; fileInput.value = ''; alert('נוסף!'); };
                reader.readAsDataURL(fileInput.files[0]);
            } else { socket.emit('addSingleQuestion', q); document.getElementById('qText').value = ''; alert('נוסף!'); }
        }
        
        function startGame() { socket.emit('startGame'); }
        function nextQuestion() { socket.emit('nextQuestion'); }
        function prevQuestion() { socket.emit('prevQuestion'); } 
        function toggleLock(state) { socket.emit('toggleLock', state); }
        function revealAnswer() { socket.emit('revealAnswer'); } 
        function showChart() { socket.emit('showChart'); }
        function sendEffect(type) { socket.emit('triggerEffect', type); }
        function toggleMusic(state) { socket.emit('toggleMusic', state); }
        function startTimer() { socket.emit('startTimer', 15); }
        function clearCurrentQuestions() { if(confirm('למחוק הכל?')) socket.emit('clearQuestions'); }
        function clearPlayers() { if(confirm('לנתק כולם?')) socket.emit('clearPlayers'); }
        function triggerVictory() { if(confirm('לסיים ולהציג פודיום?')) socket.emit('showVictoryScreen'); }
        
        function saveToBank() { const name = document.getElementById('newGameName').value; socket.emit('saveGameToBank', name); document.getElementById('newGameName').value='';}
        function loadFromBank() { const name = document.getElementById('savedGamesList').value; socket.emit('loadGameFromBank', name); }
        function deleteFromBank() { const name = document.getElementById('savedGamesList').value; socket.emit('deleteGameFromBank', name); }
    </script>
</body>
</html>
